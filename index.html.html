<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>প্রো হিসাব ও বাজার ট্র্যাকার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F4F1E9;
    --paper-2:#EBE7DA;
    --ink:#22301F;
    --ink-soft:#5B6357;
    --line:#D8D2BF;
    --surface:#FFFEFB;
    --income:#2F6F4E;
    --income-soft:#E5F0E8;
    --expense:#B0432E;
    --expense-soft:#F6E7E2;
    --balance:#2A5C82;
    --balance-soft:#E3EDF3;
    --accent:#C68A2E;
    --shadow: 0 1px 0 rgba(34,48,31,0.06), 0 8px 20px -14px rgba(34,48,31,0.35);
    --radius: 14px;
    --tab-radius: 10px 10px 0 0;
  }
  html[data-theme="dark"]{
    --paper:#141A15;
    --paper-2:#1B221C;
    --ink:#E9E6D9;
    --ink-soft:#A6AA9C;
    --line:#2C352C;
    --surface:#1B2320;
    --income:#5FC48C;
    --income-soft:#1E2E24;
    --expense:#E48468;
    --expense-soft:#2E211E;
    --balance:#7FB5DD;
    --balance-soft:#1D2A33;
    --accent:#D9A64C;
    --shadow: 0 1px 0 rgba(0,0,0,0.4), 0 8px 24px -14px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--line) 28px);
    background-blend-mode: normal;
    color:var(--ink);
    font-family:'Hind Siliguri', sans-serif;
    font-feature-settings: "tnum" 1;
    min-height:100vh;
    padding:28px 20px 60px;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .wrap{max-width:1180px; margin:0 auto;}

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:14px;
    margin-bottom:22px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:44px; height:44px; border-radius:10px;
    background:linear-gradient(155deg, var(--income), var(--balance));
    display:flex; align-items:center; justify-content:center;
    font-size:22px; box-shadow:var(--shadow); flex-shrink:0;
  }
  .brand h1{
    font-family:'Tiro Bangla', serif;
    font-size:26px; margin:0; letter-spacing:0.2px;
    color:var(--ink);
  }
  .brand span.sub{
    display:block; font-size:12.5px; color:var(--ink-soft); font-weight:500; margin-top:2px;
    font-family:'Hind Siliguri', sans-serif;
  }
  .top-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .btn{
    border:none; cursor:pointer; border-radius:10px;
    padding:11px 16px; font-family:'Hind Siliguri',sans-serif;
    font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;
    box-shadow:var(--shadow); transition:transform .12s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  .btn-dark{background:linear-gradient(155deg,#3B3120,#5A4A2C); color:#F4EBD4;}
  html[data-theme="dark"] .btn-dark{background:linear-gradient(155deg,#E9D9AE,#D9C185); color:#2A2213;}
  .btn-excel{background:var(--income); color:#fff;}
  .btn-backup{background:var(--balance); color:#fff;}
  .link-mini{
    font-size:12.5px; color:var(--ink-soft); text-decoration:underline dotted;
    background:none; border:none; cursor:pointer; font-family:inherit; padding:0;
  }
  .link-mini:hover{color:var(--ink);}
  .backup-row{display:flex; gap:14px; justify-content:flex-end; margin:-10px 0 20px; flex-wrap:wrap;}

  .filter-bar{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
    margin-bottom:22px; flex-wrap:wrap;
  }
  .filter-bar label{font-weight:600; display:flex; align-items:center; gap:8px; font-size:14.5px;}
  select, input[type="text"], input[type="number"], input[type="date"]{
    font-family:'Hind Siliguri', sans-serif;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:9px;
    padding:10px 12px; font-size:14.5px; width:100%;
  }
  select:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  #monthFilter{width:auto; min-width:220px;}

  .summary{
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px;
  }
  @media (max-width:820px){ .summary{grid-template-columns:1fr;} }
  .sum-card{
    background:var(--surface); border-radius:var(--radius); overflow:hidden;
    box-shadow:var(--shadow); border:1px solid var(--line); position:relative;
    text-align:center; padding:22px 16px 20px;
  }
  .sum-card::before{content:""; position:absolute; top:0; left:0; right:0; height:4px;}
  .sum-card.income::before{background:var(--income);}
  .sum-card.expense::before{background:var(--expense);}
  .sum-card.balance::before{background:var(--balance);}
  .sum-card .label{font-size:14.5px; color:var(--ink-soft); font-weight:600; margin-bottom:10px;}
  .sum-card .value{font-family:'Tiro Bangla',serif; font-size:30px; font-weight:700;}
  .sum-card.income .value{color:var(--income);}
  .sum-card.expense .value{color:var(--expense);}
  .sum-card.balance .value{color:var(--balance);}

  .columns{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start;}
  @media (max-width:980px){ .columns{grid-template-columns:1fr;} }

  .panel{
    background:var(--surface); border:1px solid var(--line);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    box-shadow:var(--shadow); position:relative; padding:20px 18px 18px; margin-top:22px;
  }
  .tab{
    position:absolute; top:-22px; left:0;
    background:var(--surface); border:1px solid var(--line); border-bottom:none;
    border-radius:var(--tab-radius);
    padding:6px 14px 8px; font-family:'Tiro Bangla',serif; font-weight:700; font-size:14.5px;
    display:flex; align-items:center; gap:8px;
  }
  .tab .num{
    width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-family:'Hind Siliguri',sans-serif;
  }
  .panel h2{
    font-family:'Tiro Bangla', serif; font-size:17px; margin:2px 0 14px;
    padding-bottom:10px; border-bottom:1px dashed var(--line); color:var(--ink);
  }
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .save-btn{
    width:100%; border:none; padding:12px; border-radius:9px; font-weight:700; font-size:15px;
    cursor:pointer; color:#fff; font-family:'Hind Siliguri',sans-serif; box-shadow:var(--shadow);
    transition:filter .12s ease, transform .12s ease; margin-top:4px;
  }
  .save-btn:hover{filter:brightness(1.07);}
  .save-btn:active{transform:translateY(1px);}
  .save-income{background:var(--income);}
  .save-plan{background:var(--balance);}
  .save-expense{background:var(--expense);}

  table{width:100%; border-collapse:collapse; margin-top:16px; font-size:13.5px;}
  thead th{
    background:var(--ink); color:var(--paper); text-align:left; font-weight:700;
    padding:9px 10px; font-size:12.5px;
  }
  html[data-theme="dark"] thead th{background:var(--paper-2); color:var(--ink);}
  tbody td{padding:9px 10px; border-bottom:1px dashed var(--line); vertical-align:top;}
  tbody tr:hover{background:var(--paper-2);}
  .del-btn{
    border:none; background:var(--expense-soft); color:var(--expense);
    border-radius:6px; width:26px; height:26px; cursor:pointer; font-weight:700; font-size:13px;
  }
  .del-btn:hover{filter:brightness(0.95);}
  .empty-row td{
    text-align:center; color:var(--ink-soft); font-style:italic; padding:18px 8px;
  }
  .amt{font-weight:700; font-variant-numeric:tabular-nums;}
  .amt.pos{color:var(--income);}
  .amt.neg{color:var(--expense);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:rgba(34,48,31,0.9); color:#fff; padding:10px 18px; border-radius:8px;
    font-size:14px; font-weight:500; opacity:0; transition:opacity 0.2s ease; pointer-events:none; z-index:999;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">💼</div>
      <div>
        <h1>প্রো হিসাব ও বাজার ট্র্যাকার</h1>
        <span class="sub">রিয়েল-টাইম ডাটা ক্লাউড সিঙ্ক সমৃদ্ধ</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn btn-dark" id="themeBtn">🌙 ডার্ক মোড</button>
      <button class="btn btn-excel" id="exportBtn">📥 এক্সেল ডাউনলোড</button>
    </div>
  </header>

  <!-- ফিল্টার বার -->
  <div class="filter-bar">
    <label for="monthFilter">📅 মাস নির্বাচন:</label>
    <input type="month" id="monthFilter" />
  </div>

  <!-- ড্যাশবোর্ড কার্ডসমূহ -->
  <div class="summary">
    <div class="sum-card income">
      <div class="label">মোট আয়</div>
      <div class="value" id="totIncome">৳০</div>
    </div>
    <div class="sum-card expense">
      <div class="label">মোট খরচ</div>
      <div class="value" id="totExpense">৳০</div>
    </div>
    <div class="sum-card balance">
      <div class="label">বর্তমান ব্যালেন্স</div>
      <div class="value" id="totBalance">৳০</div>
    </div>
  </div>

  <!-- মেইন কন্টেন্ট কলাম -->
  <div class="columns">
    
    <!-- ইনপুট প্যানেল -->
    <div class="panel">
      <div class="tab"><span class="num">১</span> নতুন হিসাব যুক্ত করুন</div>
      <h2>হিসাবের এন্ট্রি ফরম</h2>
      
      <div class="field">
        <label>তারিখ</label>
        <input type="date" id="insDate" required />
      </div>
      <div class="field">
        <label>টাইপ</label>
        <select id="insType">
